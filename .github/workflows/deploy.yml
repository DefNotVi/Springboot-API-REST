name: Deploy Backend Ventas to AWS ECR

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del codigo
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Compilar proyecto con Maven (Generar JAR)
      run: mvn clean package -DskipTests

    - name: Configurar credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    - name: Login en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Construir y subir Imagen a ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: back-ventas
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Configurar credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    - name: Login en Amazon ECR para obtener URL
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Obtener ID de la Instancia App por su Tag
      id: get-instance
      run: |
        # Buscamos la instancia ec2-app que es donde deben correr tus backends
        INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=ec2-app" "Name=instance-state-name,Values=running" --query "Reservations[*].Instances[*].InstanceId" --output text)
        echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_OUTPUT

    - name: Desplegar en EC2 App via AWS Systems Manager (SSM)
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        aws ssm send-command \
          --instance-ids "${{ steps.get-instance.outputs.INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Desplegando Backend de Ventas en la capa de App" \
          --parameters 'commands=[
            "sudo apt-get update -y && sudo apt-get install docker.io -y",
            "sudo systemctl start docker || true",
            "sudo aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin '"$ECR_REGISTRY"'",
            "sudo docker pull '"$ECR_REGISTRY"'/back-ventas:latest",
            "sudo docker stop back-ventas || true",
            "sudo docker rm back-ventas || true",
            "sudo docker run -d --name back-ventas -p 8080:8080 '"$ECR_REGISTRY"'/back-ventas:latest"
          ]' \
          --region us-east-1